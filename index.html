<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AETHER CLASH - First Person Sword Fight</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.134/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    body { margin:0; overflow:hidden; background:#000; font-family: 'Impact', sans-serif; }
    #game { position:absolute; top:0; left:0; width:100%; height:100%; }
    #crosshair { position:absolute; top:50%; left:50%; font-size:30px; color:#ff3366; transform:translate(-50%,-50%); pointer-events:none; user-select:none; }
    #hud { position:absolute; top:20px; left:20px; color:white; font-size:1.4rem; }
    #health { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); padding:10px 30px; border:3px solid #ff3366; font-size:1.6rem; }
  </style>
</head>
<body>
  <div id="crosshair">+</div>
  <div id="hud">AETHER CLASH - FIRST PERSON SWORD FIGHT</div>
  <div id="health">Health: <span id="player-hp">100</span>%</div>
  <canvas id="game"></canvas>

  <script>
    let scene, camera, renderer;
    let player, enemy;
    let keys = {};
    let moveSpeed = 0.25;
    let isAttacking = false;
    let canAttack = true;
    let playerHealth = 100;

    class SwordFighter {
      constructor(isPlayer) {
        this.isPlayer = isPlayer;
        this.health = 100;
        this.model = null;
        this.sword = null;
      }
    }

    async function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x110022);
      scene.fog = new THREE.Fog(0x110022, 15, 60);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(0, 1.8, 0);

      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game'), antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;

      // Lights
      scene.add(new THREE.AmbientLight(0xaaaaaa, 0.8));
      const dirLight = new THREE.DirectionalLight(0xffaaee, 1.2);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // Floor
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(100, 100),
        new THREE.MeshStandardMaterial({ color: 0x220033 })
      );
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // Enemy (Lira)
      enemy = new SwordFighter(false);
      enemy.model = new THREE.Mesh(
        new THREE.BoxGeometry(2, 4, 2),
        new THREE.MeshStandardMaterial({ color: 0x9900ff })
      );
      enemy.model.position.set(8, 2, 0);
      scene.add(enemy.model);

      // Simple Sword for Player (First Person)
      const swordGroup = new THREE.Group();
      const blade = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 3, 0.1),
        new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9 })
      );
      blade.position.set(0.5, -1.5, -1.5);
      swordGroup.add(blade);
      scene.add(swordGroup);
      playerSword = swordGroup;

      document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
      document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
      document.addEventListener('mousedown', onMouseClick);

      // Lock mouse pointer
      document.addEventListener('click', () => document.body.requestPointerLock());

      document.addEventListener('mousemove', onMouseMove);

      animate();
    }

    let yaw = 0, pitch = 0;
    function onMouseMove(e) {
      if (document.pointerLockElement) {
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-1.5, Math.min(1.5, pitch));
        camera.rotation.set(pitch, yaw, 0);
      }
    }

    let playerSword;
    function onMouseClick(e) {
      if (e.button === 0 && canAttack) { // Left Click - Attack
        attack();
      }
      if (e.button === 2) { // Right Click - Block
        console.log("BLOCK!");
      }
    }

    function attack() {
      if (!canAttack) return;
      canAttack = false;
      isAttacking = true;

      // Sword swing animation
      playerSword.rotation.z = -1.2;
      setTimeout(() => {
        playerSword.rotation.z = 0;
        isAttacking = false;
      }, 300);

      // Check hit
      if (enemy.model) {
        const distance = camera.position.distanceTo(enemy.model.position);
        if (distance < 6) {
          enemy.health -= 25;
          createHitEffect(enemy.model.position);
          if (enemy.health <= 0) {
            alert("You Win! Victory!");
            location.reload();
          }
        }
      }

      setTimeout(() => canAttack = true, 600);
    }

    function createHitEffect(pos) {
      const particles = new THREE.Points(
        new THREE.BufferGeometry(),
        new THREE.PointsMaterial({ color: 0xff0000, size: 0.4 })
      );
      particles.position.copy(pos);
      scene.add(particles);
      setTimeout(() => scene.remove(particles), 300);
    }

    function animate() {
      requestAnimationFrame(animate);

      // Player Movement
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);

      if (keys['w']) camera.position.addScaledVector(forward, moveSpeed);
      if (keys['s']) camera.position.addScaledVector(forward, -moveSpeed);
      if (keys['a']) camera.position.addScaledVector(right, -moveSpeed);
      if (keys['d']) camera.position.addScaledVector(right, moveSpeed);

      // Enemy simple AI
      if (enemy.model) {
        const dirToPlayer = new THREE.Vector3().subVectors(camera.position, enemy.model.position).normalize();
        enemy.model.position.addScaledVector(dirToPlayer, 0.08);

        if (Math.random() < 0.02) {
          createHitEffect(camera.position);
          playerHealth -= 8;
          document.getElementById('player-hp').textContent = Math.max(0, playerHealth);
          if (playerHealth <= 0) {
            alert("You Died! Game Over");
            location.reload();
          }
        }
      }

      // Fire Power (Press F)
      if (keys['f']) {
        createFireExplosion(camera.position);
        keys['f'] = false;
      }

      renderer.render(scene, camera);
    }

    function createFireExplosion(pos) {
      const count = 50;
      const geom = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i += 3) {
        positions[i] = pos.x + (Math.random()-0.5)*4;
        positions[i+1] = pos.y + Math.random()*3;
        positions[i+2] = pos.z + (Math.random()-0.5)*4;
      }
      geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({ color: 0xff8800, size: 0.5, transparent: true });
      const fire = new THREE.Points(geom, mat);
      scene.add(fire);
      setTimeout(() => scene.remove(fire), 600);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start Game
    init();
  </script>
</body>
</html>
