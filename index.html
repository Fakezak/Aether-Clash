<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0, minimum-scale=0.5">
  <title>⚔️ 3D SOUL EDGE · Anime Duel Arena</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Cinzel', 'Segoe UI', serif;
      background: #000;
    }
    /* Start Menu / Intro */
    .start-menu {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, #0d0b1a 0%, #020105 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 300;
      backdrop-filter: blur(18px);
      transition: opacity 0.9s ease, visibility 0.9s;
    }
    .start-menu.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .game-logo {
      font-size: 5.5rem;
      font-family: 'Cinzel', serif;
      color: #f7e3b2;
      filter: drop-shadow(0 0 35px #ff8c3a);
      letter-spacing: 12px;
      margin-bottom: 20px;
    }
    .subtitle {
      color: #d4af37;
      font-size: 1.6rem;
      letter-spacing: 6px;
      margin-bottom: 45px;
    }
    .start-btn {
      background: transparent;
      border: 3px solid #e6b422;
      color: #ffdd99;
      font-size: 2rem;
      padding: 15px 55px;
      border-radius: 60px;
      cursor: pointer;
      font-weight: bold;
      backdrop-filter: blur(12px);
      background: rgba(20, 10, 20, 0.5);
      transition: 0.3s;
      letter-spacing: 4px;
      box-shadow: 0 0 30px #b85e0c;
      margin-top: 20px;
    }
    .start-btn:hover {
      background: #b87c2c;
      color: black;
      box-shadow: 0 0 70px #ffaa33;
      transform: scale(1.07);
    }

    /* UI Overlay */
    .ui-container {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      z-index: 200;
      background: rgba(10, 5, 20, 0.7);
      backdrop-filter: blur(15px);
      padding: 12px 25px;
      border-radius: 60px;
      border: 1px solid #c9a063;
      box-shadow: 0 10px 30px black;
    }
    .magic-btn {
      background: #1a1428;
      border: 2px solid #dba851;
      color: #fdedc3;
      padding: 12px 20px;
      border-radius: 3rem;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
      box-shadow: 0 4px 12px black;
      letter-spacing: 1px;
    }
    .magic-btn:hover {
      background: #3a2f4c;
      border-color: #ffbb2e;
      box-shadow: 0 0 25px #f0a500;
      color: white;
    }
    .status-text {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #f7e3b2;
      background: rgba(0,0,0,0.7);
      padding: 8px 28px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 1.2rem;
      z-index: 200;
      text-shadow: 0 0 15px black;
      border: 1px solid #b88645;
    }
    /* Cutscene overlay */
    .cutscene-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 250;
      animation: fadeIn 0.25s;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .cutscene-card {
      background: #1e1525;
      border: 4px double #f3bc5e;
      border-radius: 70px 25px 70px 25px;
      padding: 35px;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 0 90px #c97e1a;
    }
    .cutscene-text {
      color: #ffd78b;
      font-size: 2.5rem;
      font-weight: bold;
      text-shadow: 0 0 25px red, 0 0 50px orange;
      margin: 15px 0;
    }
    .close-btn {
      background: #d4af37;
      border: none;
      color: black;
      font-weight: bold;
      padding: 12px 28px;
      border-radius: 3rem;
      font-size: 1.3rem;
      cursor: pointer;
      margin-top: 20px;
    }
    @media (max-width: 700px) {
      .magic-btn { padding: 8px 14px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
<!-- START MENU -->
<div class="start-menu" id="startMenu">
  <div class="game-logo">SOUL EDGE</div>
  <div class="subtitle">⚔️ 刻の刃 ⚔️</div>
  <button class="start-btn" id="beginJourneyBtn">⚡ ENGAGE ⚡</button>
  <p style="color:#9e8b6f; margin-top:35px;">enter the 3D arena</p>
</div>

<!-- UI -->
<div class="status-text" id="statusMessage">⚔️ Prepare for battle...</div>
<div class="ui-container" id="uiButtons" style="visibility: hidden;">
  <button class="magic-btn" id="basicSwordBtn">🗡️ Swift Strike</button>
  <button class="magic-btn" id="fireMagicBtn">🔥 Inferno</button>
  <button class="magic-btn" id="iceMagicBtn">❄️ Frozen</button>
  <button class="magic-btn" id="lightningMagicBtn">⚡ Thunder</button>
</div>

<div id="cutsceneContainer"></div>

<!-- Three.js library -->
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

  // ----- GLOBAL VARIABLES -----
  const startMenu = document.getElementById('startMenu');
  const beginBtn = document.getElementById('beginJourneyBtn');
  const statusDiv = document.getElementById('statusMessage');
  const uiButtons = document.getElementById('uiButtons');
  const cutsceneContainer = document.getElementById('cutsceneContainer');
  
  let scene, camera, renderer, labelRenderer, controls;
  let playerModel, enemyModel;
  let arenaGroup;
  let cutsceneActive = false;
  let gameStarted = false;
  
  // Animation / effects
  let clock = new THREE.Clock();
  
  // Cutscene data
  const cutsceneLibrary = {
    fire: { title: "🔥 INFERNO SLASH", description: "Flames consume the blade!", icon: "🔥🐦‍🔥", color: 0xff5500 },
    ice: { title: "❄️ FROZEN PETALS", description: "Blossoms freeze in time.", icon: "❄️🌸", color: 0x88ccff },
    lightning: { title: "⚡ THUNDER EDGE", description: "Lightning dances on katana.", icon: "⚡🌩️", color: 0xffdd44 },
    sword: { title: "🗡️ SWIFT STRIKE", description: "A flawless slash.", icon: "⚔️💨", color: 0xcccccc }
  };

  // ----- INITIALIZE THREE.JS WORLD -----
  function initThree() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a14);
    scene.fog = new THREE.Fog(0x0a0a14, 5, 35);
    
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 80);
    camera.position.set(8, 5, 13);
    camera.lookAt(0, 1.2, 0);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);
    
    labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0px';
    labelRenderer.domElement.style.left = '0px';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);
    
    // Controls (slight orbit for 3D feel)
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.3, 0);
    controls.maxPolarAngle = Math.PI/2.2;
    controls.minDistance = 6;
    controls.maxDistance = 18;
    controls.update();
    
    // Lighting
    const ambient = new THREE.AmbientLight(0x404066);
    scene.add(ambient);
    const dirLight = new THREE.DirectionalLight(0xffeedd, 1.1);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    dirLight.receiveShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 40;
    dirLight.shadow.camera.left = -12;
    dirLight.shadow.camera.right = 12;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -6;
    scene.add(dirLight);
    
    const backLight = new THREE.PointLight(0x4466aa, 0.8, 15);
    backLight.position.set(-3, 2, 5);
    scene.add(backLight);
    
    createArena();
    createPlayerModel();
    createEnemyModel();
    
    window.addEventListener('resize', onWindowResize);
    animate();
  }
  
  function createArena() {
    arenaGroup = new THREE.Group();
    
    // Ground platform
    const groundGeo = new THREE.CircleGeometry(6, 64);
    const groundMat = new THREE.MeshStandardMaterial({ 
      color: 0x2a2a3a, roughness: 0.7, metalness: 0.4 
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI/2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    arenaGroup.add(ground);
    
    // Ring border
    const ringGeo = new THREE.TorusGeometry(4.2, 0.15, 32, 64);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0xc9a063, roughness: 0.3, metalness: 0.8 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI/2;
    ring.position.y = 0.05;
    ring.receiveShadow = true;
    arenaGroup.add(ring);
    
    // Pillars
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const radius = 4.6;
      const px = Math.cos(angle) * radius;
      const pz = Math.sin(angle) * radius;
      
      const pillarGeo = new THREE.CylinderGeometry(0.25, 0.35, 1.8, 8);
      const pillarMat = new THREE.MeshStandardMaterial({ color: 0x886644, roughness: 0.5, metalness: 0.6 });
      const pillar = new THREE.Mesh(pillarGeo, pillarMat);
      pillar.position.set(px, 0.9, pz);
      pillar.castShadow = true;
      pillar.receiveShadow = true;
      arenaGroup.add(pillar);
      
      const topGem = new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 8),
        new THREE.MeshStandardMaterial({ color: 0xffaa33, emissive: new THREE.Color(0x331100), roughness: 0.2 })
      );
      topGem.position.set(px, 1.9, pz);
      topGem.castShadow = true;
      arenaGroup.add(topGem);
    }
    
    // Central glowing rune
    const runeGeo = new THREE.CylinderGeometry(0.8, 0.9, 0.15, 8);
    const runeMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, emissive: new THREE.Color(0x221100), roughness: 0.3 });
    const rune = new THREE.Mesh(runeGeo, runeMat);
    rune.position.y = 0.08;
    rune.receiveShadow = true;
    arenaGroup.add(rune);
    
    scene.add(arenaGroup);
  }
  
  function createPlayerModel() {
    playerModel = new THREE.Group();
    playerModel.position.set(-2.1, 0, 1.8);
    
    // Body
    const bodyGeo = new THREE.CylinderGeometry(0.4, 0.5, 1.4, 8);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3b6bb0, roughness: 0.4, metalness: 0.5 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.0;
    body.castShadow = true;
    body.receiveShadow = true;
    playerModel.add(body);
    
    // Head
    const headGeo = new THREE.SphereGeometry(0.35, 16);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.3 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.85;
    head.castShadow = true;
    head.receiveShadow = true;
    playerModel.add(head);
    
    // Hair
    const hairGeo = new THREE.ConeGeometry(0.4, 0.35, 8);
    const hairMat = new THREE.MeshStandardMaterial({ color: 0x222244, roughness: 0.7 });
    const hair = new THREE.Mesh(hairGeo, hairMat);
    hair.position.y = 2.15;
    hair.castShadow = true;
    playerModel.add(hair);
    
    // Sword
    const bladeGeo = new THREE.BoxGeometry(0.1, 0.9, 0.05);
    const bladeMat = new THREE.MeshStandardMaterial({ color: 0xd4dcec, emissive: new THREE.Color(0x112233), metalness: 0.9 });
    const blade = new THREE.Mesh(bladeGeo, bladeMat);
    blade.position.set(0.45, 1.35, 0.1);
    blade.castShadow = true;
    playerModel.add(blade);
    
    const guardGeo = new THREE.BoxGeometry(0.25, 0.12, 0.12);
    const guard = new THREE.Mesh(guardGeo, new THREE.MeshStandardMaterial({ color: 0xc9a24b, metalness: 0.8 }));
    guard.position.set(0.42, 0.9, 0.1);
    guard.castShadow = true;
    playerModel.add(guard);
    
    // Label
    const labelDiv = document.createElement('div');
    labelDiv.textContent = '⚔️ RONIN';
    labelDiv.style.color = '#aaccff';
    labelDiv.style.fontWeight = 'bold';
    labelDiv.style.textShadow = '0 0 10px blue';
    const label = new CSS2DObject(labelDiv);
    label.position.set(0, 2.5, 0);
    playerModel.add(label);
    
    scene.add(playerModel);
  }
  
  function createEnemyModel() {
    enemyModel = new THREE.Group();
    enemyModel.position.set(2.1, 0, -1.6);
    
    const bodyGeo = new THREE.CylinderGeometry(0.4, 0.5, 1.4, 8);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x99322e, roughness: 0.4, metalness: 0.5 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 1.0;
    body.castShadow = true;
    body.receiveShadow = true;
    enemyModel.add(body);
    
    const headGeo = new THREE.SphereGeometry(0.35, 16);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xddb494, roughness: 0.3 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.85;
    head.castShadow = true;
    enemyModel.add(head);
    
    const helmGeo = new THREE.ConeGeometry(0.38, 0.3, 8);
    const helmMat = new THREE.MeshStandardMaterial({ color: 0x442222, roughness: 0.5, metalness: 0.7 });
    const helm = new THREE.Mesh(helmGeo, helmMat);
    helm.position.y = 2.15;
    helm.castShadow = true;
    enemyModel.add(helm);
    
    const bladeGeo = new THREE.BoxGeometry(0.1, 0.9, 0.05);
    const bladeMat = new THREE.MeshStandardMaterial({ color: 0x905a5a, emissive: new THREE.Color(0x220000), metalness: 0.9 });
    const blade = new THREE.Mesh(bladeGeo, bladeMat);
    blade.position.set(-0.45, 1.35, -0.1);
    blade.castShadow = true;
    enemyModel.add(blade);
    
    const labelDiv = document.createElement('div');
    labelDiv.textContent = '👹 ONI';
    labelDiv.style.color = '#ff8866';
    labelDiv.style.fontWeight = 'bold';
    const label = new CSS2DObject(labelDiv);
    label.position.set(0, 2.5, 0);
    enemyModel.add(label);
    
    scene.add(enemyModel);
  }
  
  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
  }
  
  function animate() {
    requestAnimationFrame(animate);
    
    if (gameStarted && playerModel && enemyModel) {
      // subtle idle breathing
      const time = Date.now() * 0.002;
      playerModel.position.y = Math.sin(time * 3) * 0.02;
      enemyModel.position.y = Math.sin(time * 3 + 1) * 0.02;
    }
    
    controls.update();
    
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }
  
  // ----- EFFECTS & CUTSCENE -----
  function spawnMagicEffect(color, position, emoji = '✨') {
    const light = new THREE.PointLight(color, 1.5, 6);
    light.position.copy(position);
    scene.add(light);
    setTimeout(() => scene.remove(light), 400);
    
    const particles = new THREE.Group();
    for (let i = 0; i < 8; i++) {
      const geo = new THREE.SphereGeometry(0.08, 4);
      const mat = new THREE.MeshBasicMaterial({ color: color });
      const particle = new THREE.Mesh(geo, mat);
      particle.position.set(
        (Math.random() - 0.5) * 0.8,
        (Math.random() - 0.5) * 0.8 + 0.5,
        (Math.random() - 0.5) * 0.8
      );
      particles.add(particle);
    }
    particles.position.copy(position);
    scene.add(particles);
    setTimeout(() => scene.remove(particles), 550);
  }
  
  function showCutscene(magicKey) {
    if (cutsceneActive || !gameStarted) return;
    cutsceneActive = true;
    const data = cutsceneLibrary[magicKey];
    statusDiv.textContent = `🌀 ${data.title} unleashed!`;
    
    cutsceneContainer.innerHTML = '';
    const overlay = document.createElement('div');
    overlay.className = 'cutscene-overlay';
    overlay.innerHTML = `
      <div class="cutscene-card">
        <div style="font-size:4rem;">${data.icon}</div>
        <div class="cutscene-text">${data.title}</div>
        <p style="color:#edd9b0;">${data.description}</p>
        <button class="close-btn" id="closeCutsceneBtn">⚡ CONTINUE</button>
      </div>
    `;
    cutsceneContainer.appendChild(overlay);
    
    document.getElementById('closeCutsceneBtn').addEventListener('click', closeCutscene);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeCutscene(); });
    
    if (enemyModel) {
      spawnMagicEffect(data.color, enemyModel.position.clone().add(new THREE.Vector3(0,1.2,0)), data.icon);
    }
  }
  
  function closeCutscene() {
    cutsceneActive = false;
    cutsceneContainer.innerHTML = '';
    statusDiv.textContent = '⚔️ Battle continues...';
  }
  
  function attackAnimation(magicKey = null) {
    if (!playerModel || !enemyModel || cutsceneActive) return;
    
    const origPos = playerModel.position.clone();
    playerModel.position.z += 0.5;
    setTimeout(() => { playerModel.position.copy(origPos); }, 180);
    
    if (magicKey && cutsceneLibrary[magicKey]) {
      setTimeout(() => showCutscene(magicKey), 200);
    } else if (!magicKey) {
      spawnMagicEffect(0xcccccc, enemyModel.position.clone().add(new THREE.Vector3(0,1,0)), '💥');
    }
  }
  
  // ----- START GAME -----
  function startGame() {
    if (gameStarted) return;
    gameStarted = true;
    startMenu.classList.add('hidden');
    uiButtons.style.visibility = 'visible';
    statusDiv.textContent = '⚔️ 3D Duel · Choose magic!';
    controls.target.set(0, 1.3, 0);
    controls.update();
  }
  
  // ----- EVENT LISTENERS -----
  beginBtn.addEventListener('click', startGame);
  
  document.getElementById('basicSwordBtn').addEventListener('click', () => {
    if (!gameStarted || cutsceneActive) return;
    attackAnimation(null);
    setTimeout(() => { if (!cutsceneActive) showCutscene('sword'); }, 250);
  });
  document.getElementById('fireMagicBtn').addEventListener('click', () => attackAnimation('fire'));
  document.getElementById('iceMagicBtn').addEventListener('click', () => attackAnimation('ice'));
  document.getElementById('lightningMagicBtn').addEventListener('click', () => attackAnimation('lightning'));
  
  // Start everything
  initThree();
</script>
</body>
</html>
